name: Publish website
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Refresh and verify public metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover -s tests
          python scripts/sync_metadata.py
          python scripts/build.py
          python scripts/check_site.py
      - uses: actions/configure-pages@v5
      - name: Stage public pages and assets
        run: |
          mkdir public
          cp -r index.html style.css assets community docs download issues news packages wiki LICENSE public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: publish
        uses: actions/deploy-pages@v4
