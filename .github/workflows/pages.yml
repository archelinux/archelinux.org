name: Publish website
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Refresh and verify public metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover -s tests
          python scripts/sync_metadata.py
          python scripts/build.py
          python scripts/check_site.py
      - uses: actions/configure-pages@v5
      - name: Stage public pages and assets
        run: |
          mkdir public
          cp -r index.html style.css assets community docs download issues news packages wiki LICENSE public/
          python scripts/stage_mirror.py public/mirror/stable
      - id: name
        run: echo "artifact=site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
